# dsh-agent-team-playbook —— DSH bundle patch
#
# 挂载本插件，注册只读命令 `/atp`：
#   /atp          规程摘要 + 安装方式
#   /atp core     核心全文（读完即在本轮遵循）
#   /atp paths    分册绝对路径
#   /atp help     用法
#
# 本插件不写任何文件，也不挂载 skill：
#   · 不挂 skill 是因为 skill 的目录摘要会常驻占用上下文（约 300 tokens/轮），
#     而分册本来就不自动进上下文，用命令按需取更划算；
#   · 要让规程成为每轮固定上下文，用 CLI：
#       npx dsh-agent-team-playbook init                    # 项目级，写 AGENTS.md + docs/
#       npx dsh-agent-team-playbook init --global           # 全局，受管区块（指针）
#       npx dsh-agent-team-playbook init --global --inline-core  # 全局，内联核心全文
#
# 安装：dsh plugin --profile web add dsh-agent-team-playbook
# 本地开发：dsh plugin --profile web add link:<本目录绝对路径>

- insert:
    - id: dsh-agent-team-playbook
      name: dsh-agent-team-playbook
      config: {}
